name: Refresh Dans mon salon videos

on:
  schedule:
    # Tous les jours à 06:30 UTC
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch salon videos from YouTube RSS
        run: npm run fetch:salon

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- assets/salon-videos.json; then
            echo "Aucune mise à jour des vidéos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/salon-videos.json
          git commit -m "chore: met à jour les vidéos Dans mon salon"
          git push
