<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#D05033" />
    <title>Boutique officielle — Niels</title>
    <meta name="description" content="Boutique officielle de Niels : CD, merchandising, affiches et éditions limitées. Paiement sécurisé et livraison." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://www.niels-officiel.fr/boutique" />
    <link rel="alternate" hreflang="fr" href="https://www.niels-officiel.fr/boutique" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Niels" />
    <meta property="og:url" content="https://www.niels-officiel.fr/boutique" />
    <meta property="og:title" content="Boutique officielle — Niels" />
    <meta property="og:description" content="CD, merchandising, affiches et éditions limitées. Boutique officielle de Niels." />
    <meta property="og:image" content="https://www.niels-officiel.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boutique officielle — Niels" />
    <meta name="twitter:description" content="CD, merchandising, affiches et éditions limitées." />
    <meta name="twitter:image" content="https://www.niels-officiel.fr/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" />

    <link rel="stylesheet" href="./dist/tailwind.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./main.js"></script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Boutique Niels",
        "url": "https://www.niels-officiel.fr/boutique",
        "image": "https://www.niels-officiel.fr/og-image.jpg",
        "description": "Boutique officielle de Niels : CD, merchandising et éditions limitées.",
        "brand": {
          "@type": "Brand",
          "name": "Niels"
        }
      }
    </script>
  </head>

  <body data-shop-mode="catalog">
    <a class="skip" href="#main">Aller au contenu</a>

    <header class="header" id="top" data-elevate>
      <nav class="nav" aria-label="Navigation principale">
        <div class="nav__side nav__side--left">
          <a class="nav__link" href="/#music">Musique</a>
          <a class="nav__link" href="/#concerts">Concerts</a>
        </div>

        <a class="nav__brand" href="/" aria-label="Retour à l'accueil">
          <img src="assets/logo-white.svg" alt="Niels" style="height: 26px; width: auto;" />
        </a>

        <div class="nav__side nav__side--right">
          <a class="nav__link" href="/#pro">Espace pro</a>
          <a class="nav__link nav__link--active" href="/boutique" data-shop-nav aria-current="page">Boutique</a>
          <a class="nav__link" href="/#contact">Contact</a>
        </div>

        <button class="nav__burger" aria-label="Ouvrir le menu" aria-expanded="false">
          <span class="burger__bar"></span>
          <span class="burger__bar"></span>
          <span class="burger__bar"></span>
        </button>
      </nav>
    </header>

    <main id="main">
      <section class="section section--boutique-page" id="shop" aria-label="Boutique">
        <div class="container">
          <div class="section__head section__head--boutique">
            <div>
              <p class="boutique-page__kicker">Shop</p>
              <h1 class="section__title">Boutique</h1>
              <p class="body body--muted" id="shopIntro" hidden></p>
            </div>
            <a class="btn btn--ghost" href="/">← Retour à l'accueil</a>
          </div>

          <div
            class="products products--catalog reveal"
            id="shopProducts"
            aria-live="polite"
            aria-busy="true"
            aria-label="Catalogue produits"
          ></div>

          <div class="center" id="shopCtaWrap" hidden>
            <a class="btn btn--primary" id="shopCta" href="#" aria-label="Accéder à la boutique">Toute la boutique</a>
          </div>
        </div>

        <div
          class="shop-modal"
          id="shopModal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="shopModalTitle"
          hidden
        >
          <div class="shop-modal__backdrop" data-shop-modal-close tabindex="-1"></div>
          <div class="shop-modal__panel">
            <button type="button" class="shop-modal__close" id="shopModalClose" aria-label="Fermer la fenêtre">
              <span aria-hidden="true">×</span>
            </button>
            <div class="shop-modal__media" id="shopModalMedia"></div>
            <div class="shop-modal__body">
              <h3 class="h3" id="shopModalTitle"></h3>
              <p class="body body--muted" id="shopModalDesc"></p>
              <p class="body body--muted shop-modal__detail" id="shopModalDetail" hidden></p>
              <p class="product__price shop-modal__price" id="shopModalPrice" hidden></p>
              <p class="shop-modal__availability" id="shopModalAvailability" hidden></p>
              <div class="shop-modal__actions">
                <button type="button" class="btn btn--primary" id="shopModalBuy" hidden>Acheter</button>
                <a class="btn btn--ghost shop-modal__cms" id="shopModalCms" href="#" hidden>Voir la fiche produit</a>
              </div>
              <p class="body body--muted shop-modal__buy-hint" id="shopModalBuyHint" hidden></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer" aria-label="Pied de page">
      <div class="container footer__bottom footer__bottom--solo">
        <div class="footer__copyright">&copy; 2026 Niels. Tous droits réservés.</div>
        <div class="footer__links">
          <a class="footer__link" href="/mentions-legales">Mentions légales</a>
          <a class="footer__link" href="/confidentialite">Confidentialité</a>
          <button type="button" class="footer__link footer__link--btn" data-cookie-open>Cookies</button>
          <a class="footer__link" href="/">Accueil</a>
        </div>
      </div>
    </footer>
  </body>
</html>
